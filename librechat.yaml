version: 1.3.12
cache: true
interface:
  customWelcome: "Welcome to LibreChat"
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: true
    public: true
  knowledgeBases:
    use: true
    create: true
    share: false
    public: false
  marketplace:
    use: true
  fileSearch: true
  fileCitations: true

endpoints:
  all:
    titlePrompt: |
      根据下面的对话生成一个简短标题。
      要求：
      - 使用对话的主要语言；如果用户用中文提问，标题必须是中文
      - 5 个词以内
      - 不要标点、引号、解释
      只返回标题本身。

      对话：
      {convo}
    titlePromptTemplate: |
      用户：{input}
      助手：{output}
